{% extends "base.html" %}
{% block body %}
<div class="min-h-screen grid place-items-center p-6"><div class="card p-10 text-center max-w-md">
  <div class="text-6xl font-head font-extrabold text-primary">{{ error.code or 'Lỗi' }}</div>
  <p class="mt-3 text-muted">{{ error.description if error.code in (400, 403) else 'Trang bạn tìm không tồn tại hoặc đã được di chuyển.' }}</p>
  <a href="{{ url_for('public.landing') }}" class="btn btn-primary mt-6">Về trang chủ</a>
</div></div>
{% endblock %}
